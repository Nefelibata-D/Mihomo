# Pass 订阅示例（Mihomo 扩展）
# 将 .invalid 地址、UUID、REALITY 参数、节点 ID 和健康检查 URL 替换为实际配置。
# 校验配置：pass -t -f weighted-sticky-subscription.yaml
#
# 选路：rules 先决定代理组；只有 strategy: weighted-sticky 使用以下扩展。
# 权重仅决定新绑定的首次抽选。有效绑定优先复用，连接失败沿用内核的有界重试。
# 缓存键为入口身份（认证用户名优先，否则源 IP）与网站身份的组合。
# 网站身份默认使用 PSL eTLD+1；无法求取时使用完整域名，IP 目标按 IP 区分。
# 可在 weighted-sticky.site-groups 中指定站点组：
#   - name: example
#     domains: [login.example.invalid]
#     domain-suffixes: [example.invalid]
# 完整匹配优先，其次为最长后缀；域名统一转为小写、IDN ASCII 并移除末尾点。
#
# site-blacklist 支持 DOMAIN / PROCESS（名称、路径及正则/通配符）规则。
# 匹配当前连接元数据；绑定索引仍按域名，仅影响新绑定，不撤销已有有效绑定。
# Process lookup follows the selected proxy chain, including listeners.proxy; find-process-mode is respected.
# Domain matching uses normalized Host (lowercase, trailing dot removed, IDN ASCII), not SniffHost.
# 有未被列入黑名单的获准节点时优先使用；全部被列入时仍允许尝试。
# 条目可加 group: 默认负载 限定策略组；省略时作用于所有 weighted-sticky 组。
# rules 支持 DOMAIN / DOMAIN-SUFFIX / DOMAIN-KEYWORD / DOMAIN-REGEX /
# DOMAIN-WILDCARD / RULE-SET。正则完整匹配需自行添加 ^ 和 $。
# 旧 domains / domain-suffixes 黑名单字段不再支持。
#
# 引用规则集示例：在条目 rules 中添加 RULE-SET,websites，并配置：
# rule-providers:
#   websites:
#     type: http
#     behavior: classical
#     format: yaml
#     url: https://panel.example.invalid/rulesets/sites.yaml
#     interval: 3600
# 也支持 type: file + path，以及 type: inline + payload。
# yaml 文件使用 payload 列表，text 文件每行一条规则；只接受上述五类域名规则，
# 不带目标策略或额外参数。路由可以复用同一规则集。
# 加载与更新使用原生 provider；非法规则使整次更新失败，不发布部分解析结果。
#
# resilience.control 查询 GET {base-url}/v1/nodes/{node-id}/status，
# 使用 Authorization: Bearer {uuid}。200=normal，409=grace，403=disabled。
# normal 允许新绑定；grace 仅允许已有绑定；disabled 禁用并清除该节点绑定。
# 查询失败保持最近明确状态；未知状态不准入。健康检查不改变账户状态。
# 所有参与组的节点都需 node-ids 映射，无额度限制的节点由管理端返回 normal。
# 普通 select 组及其他负载策略不读取 site-blacklist 或账户准入配置。
#
# beta 版额外写入配置目录 diagnostics/weighted-sticky/*.ndjson，记录选路、
# 状态变化和失败事件。日志包含站点信息；普通版不生成该诊断文件。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

proxies:
  - name: 日本出口
    type: vless
    server: jp.example.invalid
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    servername: reality-jp.example.invalid
    client-fingerprint: chrome
    reality-opts:
      public-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
      short-id: "00000000"

  - name: 美国出口
    type: vless
    server: us.example.invalid
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    servername: reality-us.example.invalid
    client-fingerprint: chrome
    reality-opts:
      public-key: ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0-P0A
      short-id: "00000000"

# 新绑定的网站黑名单。
site-blacklist:
  - proxy: 日本出口
    rules:
      - DOMAIN,sensitive.example.invalid
      - DOMAIN-SUFFIX,media.example.invalid
      - DOMAIN-KEYWORD,stream
      - 'DOMAIN-REGEX,^video[0-9]+\.example\.invalid$'
      - DOMAIN-WILDCARD,*.cdn.example.invalid

proxy-groups:
  # 单节点路由。
  - name: 美国单节点
    type: select
    proxies: [美国出口]

  - name: 默认负载
    type: load-balance
    proxies: [日本出口, 美国出口]
    url: https://health.example.invalid/ready
    expected-status: 204
    interval: 300
    lazy: false
    strategy: weighted-sticky
    weighted-sticky:
      idle-timeout: 300
      default-weight: 1
      weights:
        日本出口: 7
        美国出口: 3
      max-bindings: 10000
      resilience:
        enabled: true
        control:
          base-url: https://control.example.invalid
          uuid: 00000000-0000-4000-8000-000000000001
          timeout: 3
          min-interval: 30
          grace-interval: 300
          node-ids:
            日本出口: jp
            美国出口: us

rules:
  # 需要固定出口的网站。
  - DOMAIN-SUFFIX,us-only.example.invalid,美国单节点
  - MATCH,默认负载
