# Mihomo 扩展订阅示例

# HTTP 与 SOCKS 共用的本地监听端口。
mixed-port: 7890
# 是否允许局域网设备访问。
allow-lan: false
# 按末尾 rules 选择代理或代理组。
mode: rule
log-level: info
# 是否启用 IPv6。
ipv6: false

# 出口节点；示例地址、UUID 和 REALITY 参数需替换为实际值。
proxies:
  - name: 日本出口
    type: vless
    server: jp.example.invalid
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    servername: reality-jp.example.invalid
    client-fingerprint: chrome
    reality-opts:
      public-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA
      short-id: "00000000"

  - name: 美国出口
    type: vless
    server: us.example.invalid
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    network: tcp
    tls: true
    udp: true
    servername: reality-us.example.invalid
    client-fingerprint: chrome
    reality-opts:
      public-key: ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0-P0A
      short-id: "00000000"

# 新绑定的候选排除规则，不撤销已有有效绑定；全部候选均命中时仍允许尝试。
site-blacklist:
  # 必填，对应 weighted-sticky 代理组名称；同组只写一个条目。
  - group: 默认负载
    # 每条为 类型,内容,[代理名列表]；列表不能为空，代理名对应 proxies[].name。
    # 支持 DOMAIN、PROCESS 系列及 RULE-SET；正则完整匹配需自行加 ^ 和 $。
    rules:
      - DOMAIN,sensitive.example.invalid,[日本出口]
      - DOMAIN-SUFFIX,media.example.invalid,[日本出口, 美国出口]
      - DOMAIN-KEYWORD,stream,[日本出口]
      - 'DOMAIN-REGEX,^video[0-9]+\.example\.invalid$,[日本出口]'
      - DOMAIN-WILDCARD,*.cdn.example.invalid,[日本出口]

proxy-groups:
  - name: 美国单节点
    # 手动选择此组中的出口。
    type: select
    proxies: [美国出口]

  - name: 默认负载
    # 负载均衡代理组。
    type: load-balance
    # 本组可使用的代理名称。
    proxies: [日本出口, 美国出口]
    # 节点健康检查地址，需替换。
    url: https://health.example.invalid/ready
    # 健康检查期望的 HTTP 状态码。
    expected-status: 204
    # 健康检查间隔，单位秒。
    interval: 1800
    # 不因代理组闲置而暂停定时健康检查。
    lazy: false
    # 新网站绑定按权重选择，已有有效绑定优先复用。
    strategy: weighted-sticky
    # 绑定按入口身份与网站身份区分；网站默认按主域名归组，IP 目标按 IP 区分。
    weighted-sticky:
      # 绑定空闲过期时间，单位秒，必须为正数。
      idle-timeout: 300
      # 按实际服务器组织代理；本组每个代理必须归属一个服务器。
      nodes:
        # 服务器显示名称。
        - name: 日本服务器
          # 控制端的服务器节点 ID，需替换为实际值。
          id: jp-guid
          # 正整数；按服务器计权，此例日本:美国为 7:3。
          weight: 7
          # 同服务器可放多个代理，服务器内等概率选择。
          proxies: [日本出口]
        - name: 美国服务器
          id: us-guid
          weight: 3
          proxies: [美国出口]
      # 最多缓存的网站绑定数，必须为正整数。
      max-bindings: 10000
      # 可选 site-groups：将多个域名合并为同一网站绑定。
      # domains 完整匹配优先，其次匹配 domain-suffixes 的最长后缀。
      # site-groups:
      #   - name: example
      #     domains: [login.example.invalid]
      #     domain-suffixes: [example.invalid]
      # 账户额度状态观察配置；最终限额由服务器执行。
      resilience:
        # 启用状态查询；设为 false 时不应再配置 control。
        enabled: true
        control:
          # 控制 API 根地址，按 nodes[].id 查询状态。
          base-url: https://control.example.invalid
          # 控制 API 的 Bearer 凭据，需替换。
          uuid: 00000000-0000-4000-8000-000000000001
          # 单次控制查询超时，单位秒。
          timeout: 3
          # 同服务器状态查询的最小间隔，单位秒。
          min-interval: 30
          # 宽限状态下的查询间隔，单位秒。
          grace-interval: 300

# 按顺序匹配，最后的 MATCH 处理其余请求。
rules:
  - DOMAIN-SUFFIX,us-only.example.invalid,美国单节点
  - MATCH,默认负载
