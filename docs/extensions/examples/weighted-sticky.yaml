# Complete, test-only configuration for the weighted-sticky extension.
#
# This file is not a subscription and contains no credentials. The two
# "proxies" below point at local SOCKS5 test servers; start them before running
# this configuration. Ports are intentionally high and local-only so the file
# never touches the host's existing proxy listener or a real server.
#
# Verify with the customized kernel:
#   mihomo.exe -t -f docs/extensions/examples/weighted-sticky.yaml
#
# Health comes only from this proxy group's official `url` / `expected-status` /
# `interval` checks. There is deliberately no custom probe-url or recovery loop.
# The account control address and UUID are fixed placeholders for local tests.

mixed-port: 17890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: ""

proxies:
  - name: 出口 A
    type: socks5
    server: 127.0.0.1
    port: 17891
    udp: true
  - name: 出口 B
    type: socks5
    server: 127.0.0.1
    port: 17892
    udp: true

# Shared by every proxy group that explicitly selects weighted-sticky.
site-blacklist:
  - proxy: 出口 A
    domains: [login.example.test]
    domain-suffixes: [media.example.test]

proxy-groups:
  - name: 单节点出口
    type: select
    proxies: [出口 B]
  - name: 网站负载
    type: load-balance
    proxies:
      - 出口 A
      - 出口 B
    url: http://127.0.0.1:17894/health
    expected-status: 200
    interval: 300
    strategy: weighted-sticky
    weighted-sticky:
      idle-timeout: 300
      default-weight: 1
      weights:
        "出口 A": 7
        "出口 B": 3
      max-bindings: 10000
      site-groups:
        - name: 示例服务
          domains:
            - login.example.test
            - api.example.test
          domain-suffixes:
            - media.example.test
      resilience:
        enabled: true
        control:
          base-url: http://127.0.0.1:18080
          uuid: 00000000-0000-0000-0000-000000000001 # placeholder only
          node-ids:
            出口 A: jp-a
            出口 B: us-b

rules:
  # Rules choose the group first. This single-node route does no balancing.
  - DOMAIN-SUFFIX,single.example.test,单节点出口
  # The selected two-node group alone runs weighted-sticky.
  - MATCH,网站负载
