name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOARCH: amd64
      GOAMD64: v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.([1-9][0-9]*)$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH.REVISION with REVISION >= 1" >&2
            exit 1
          fi
          upstream="${RELEASE_TAG%.*}"
          gh api "repos/MetaCubeX/mihomo/releases/tags/$upstream" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' > upstream-version.txt
          [[ "$(cat upstream-version.txt)" == "$upstream" ]]
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "BUILDTIME=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Test
        run: |
          go test ./adapter/outboundgroup/... ./component/retrystate ./rules/provider ./config ./tunnel
          go test -tags 'with_gvisor beta_diag' ./adapter/outboundgroup/... ./component/retrystate ./rules/provider ./config ./tunnel
      - name: Build Linux and Windows releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux windows; do
            for flavor in stable beta; do
              version="$VERSION"
              tags=with_gvisor
              if [[ "$flavor" == beta ]]; then
                version="${VERSION}-beta"
                tags='with_gvisor beta_diag'
              fi
              binary="mihomo-${os}-amd64"
              [[ "$os" != windows ]] || binary="${binary}.exe"
              GOOS="$os" go build -tags "$tags" -trimpath \
                -ldflags "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$BUILDTIME" \
                -o "$binary" .
              if [[ "$os" == windows ]]; then
                zip -j "dist/mihomo-${os}-amd64-${version}.zip" "$binary"
              else
                gzip -n -c "$binary" > "dist/mihomo-${os}-amd64-${version}.gz"
              fi
              rm "$binary"
            done
          done
          (cd dist && sha256sum *.gz *.zip > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: mihomo-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Linux / Windows x86-64 (AMD64, GOAMD64=v1).

          普通版用于日常使用；文件名含 beta 的版本额外记录 weighted-sticky 诊断日志。
          日志位于配置目录 diagnostics/weighted-sticky/，可能包含访问站点，请按需保存。
          订阅配置参见 docs/extensions/weighted-sticky-subscription.yaml。
          NOTES
          gh release create "$VERSION" dist/* --repo "$REPOSITORY" --target "$COMMIT" \
            --title "$VERSION" --notes-file release-notes.md --verify-tag
